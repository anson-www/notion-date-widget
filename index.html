<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Date Widget 設定產生器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', 'PingFang TC', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 50px;
    }
    h1 {
      font-size: 2.2rem;
      color: #2d3748;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .subtitle {
      color: #718096;
      margin-bottom: 40px;
      font-size: 1rem;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      margin-bottom: 40px;
    }
    @media (max-width: 768px) {
      .split { grid-template-columns: 1fr; gap: 30px; }
    }
    .section {
      background: #f7fafc;
      border-radius: 12px;
      padding: 24px;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .option {
      margin-bottom: 16px;
    }
    .option:last-child { margin-bottom: 0; }
    .option label {
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      color: #4a5568;
      cursor: pointer;
      user-select: none;
    }
    .option input[type="checkbox"],
    .option input[type="radio"] {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .preview-box {
      background: #f7fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-bottom: 30px;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .preview-box iframe {
      width: 100%;
      height: 180px;
      border: none;
      border-radius: 8px;
    }
    .output-box {
      background: #2d3748;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.9rem;
      word-break: break-all;
      position: relative;
      margin-top: 20px;
    }
    .copy-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: #5568d3;
      transform: translateY(-1px);
    }
    .copy-btn:active {
      transform: translateY(0);
    }
    .copy-btn.copied {
      background: #48bb78;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗓️ Notion Date Widget 設定產生器</h1>
    <p class="subtitle">自訂您的日期時鐘小工具，輕鬆嵌入 Notion 頁面</p>

    <div class="section-title">⚙️ Widget 設定</div>
    <div class="split">
      <div class="section">
        <div class="section-title">顯示內容</div>
        <div class="option">
          <label><input type="checkbox" id="showTime" checked> 顯示時鐘</label>
        </div>
        <div class="option">
          <label><input type="checkbox" id="showWeekNum" checked> 顯示週數</label>
        </div>
        <div class="option">
          <label><input type="checkbox" id="showWeek" checked> 顯示星期幾（於週數後方）</label>
                          </div>
                <div class="option">
                    <label><input type="checkbox" id="showDate" checked> 顯示日期</label>
                </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">外觀設定</div>
        <div class="radio-group">
          <div class="option">
            <label><input type="radio" name="theme" value="auto" checked> 自動（跟隨系統）</label>
          </div>
          <div class="option">
            <label><input type="radio" name="theme" value="light"> 淺色模式</label>
          </div>
          <div class="option">
            <label><input type="radio" name="theme" value="dark"> 深色模式</label>
          </div>
        </div>
        
            <div class="section">
                <div class="section-title">時區選擇</div>
                    <select id="timezone" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
                        <option value="local">本地時區</option>
                        <option value="Asia/Taipei">亞洲/台北 (UTC+8)</option>
                        <option value="Asia/Tokyo">亞洲/東京 (UTC+9)</option>
                        <option value="Asia/Shanghai">亞洲/上海 (UTC+8)</option>
                        <option value="Asia/Hong_Kong">亞洲/香港 (UTC+8)</option>
                        <option value="America/New_York">美洲/紐約 (UTC-5)</option>
                        <option value="America/Los_Angeles">美洲/洛杉磯 (UTC-8)</option>
                        <option value="Europe/London">歐洲/倫敦 (UTC+0)</option>
                        <option value="UTC">UTC</option>
                    </select>
            </div>
        <br>
        <div class="section-title">日期格式</div>
        <div class="radio-group">
          <div class="option">
            <label><input type="radio" name="datestyle" value="ymd" checked> 2026 . 02 . 26</label>
          </div>
          <div class="option">
            <label><input type="radio" name="datestyle" value="slash"> 2026 / 02 / 26</label>
          </div>
          <div class="option">
            <label><input type="radio" name="datestyle" value="mdy"> Feb 26, 2026</label>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title">📱 即時預覽</div>
    <div class="preview-box">
      <iframe id="preview"></iframe>
    </div>

    <div class="section-title">🔗 嵌入連結</div>
    <div class="output-box">
      <button class="copy-btn" onclick="copyURL()">複製連結</button>
      <code id="output"></code>
    </div>
  </div>

  <script>
    const baseURL = 'https://anson-www.github.io/notion-date-widget/widget.html';

    function updatePreview() {
      const theme = document.querySelector('input[name="theme"]:checked').value;
      const datestyle = document.querySelector('input[name="datestyle"]:checked').value;
      const showTime = document.getElementById('showTime').checked;
      const showWeekNum = document.getElementById('showWeekNum').checked;
      const showWeek = document.getElementById('showWeek').checked;
              const showDate = document.getElementById('showDate').checked;
        const timezone = document.getElementById('timezone').value;

      const params = new URLSearchParams();
      params.set('theme', theme);
      params.set('datestyle', datestyle);
      if (!showTime) params.set('time', 'false');
      if (!showWeekNum) params.set('weeknum', 'false');
      if (!showWeek) params.set('week', 'false');
              if (!showDate) params.set('date', 'false');
        if (timezone !== 'local') params.set('timezone', timezone);

      const url = `${baseURL}?${params.toString()}`;
      document.getElementById('preview').src = url;
      document.getElementById('output').innerText = url;
    }

    function copyURL() {
      const url = document.getElementById('output').innerText;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.innerText = '✓ 已複製！';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerText = '複製連結';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('change', updatePreview);
    });
        document.getElementById('timezone').addEventListener('change', updatePreview);

    updatePreview();
  </script>
</body>
</html>
